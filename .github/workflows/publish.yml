name: Publish to PyPI

# Publishes to PyPI on every vX.Y.Z tag using PyPI Trusted Publishing (OIDC) —
# no API token/secret is stored. Configure the trusted publisher once on PyPI
# (project: kc-sdk-python, owner: Kvindo, repo: kc-sdk-python, workflow: publish.yml).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
